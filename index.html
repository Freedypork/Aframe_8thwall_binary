<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR John</title>

    <!-- MindAR + A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; }

      /* UI overlay */
      #ui-overlay {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }

      #scan-hint {
        background: rgba(0,0,0,0.55);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        letter-spacing: 0.03em;
        padding: 10px 20px;
        border-radius: 999px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.15);
        transition: opacity 0.5s ease;
      }

      #scan-hint.hidden {
        opacity: 0;
      }
    </style>
  </head>

  <body>

    <!-- UI -->
    <div id="ui-overlay">
      <div id="scan-hint">📸 Pointe la caméra vers la photo de John</div>
    </div>

    <!-- Scène AR -->
    <a-scene
      mindar-image="
        imageTargetSrc: ./assets/targets.mind;
        autoStart: true;
        uiScanning: yes;
        uiLoading: yes;
      "
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-assets>
        <video
          id="john-video"
          src="./assets/Johnvid.mp4"
          preload="auto"
          loop="true"
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target : John.jpg (index 0) -->
      <a-entity mindar-image-target="targetIndex: 0" id="john-target">
        <a-video
          src="#john-video"
          width="1"
          height="0.5625"
          position="0 0 0.001"
          rotation="0 0 0"
        ></a-video>
      </a-entity>

    </a-scene>

    <script>
      const scene = document.querySelector('a-scene');
      const hint  = document.getElementById('scan-hint');
      const video = document.getElementById('john-video');
      const target = document.getElementById('john-target');

      // Masquer le hint quand la cible est détectée
      target.addEventListener('targetFound', () => {
        hint.classList.add('hidden');
        video.play().catch(() => {});
      });

      // Ré-afficher le hint quand la cible est perdue
      target.addEventListener('targetLost', () => {
        hint.classList.remove('hidden');
        video.pause();
      });
    </script>

  </body>
</html>
